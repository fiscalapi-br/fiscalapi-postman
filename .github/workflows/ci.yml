name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip openapi-spec-validator
      - name: JSON bem formado
        run: |
          python -m json.tool FiscalAPI.postman_collection.json > /dev/null
          python -m json.tool openapi-publico.json > /dev/null
      - name: OpenAPI válida
        run: openapi-spec-validator openapi-publico.json
      - name: Coleção sem segredos preenchidos
        run: |
          python - <<'PY'
          import json
          c = json.load(open("FiscalAPI.postman_collection.json"))
          vars_ = {v["key"]: v.get("value", "") for v in c.get("variable", [])}
          for k in ("apiKey", "certificadoBase64", "senhaCertificado"):
              assert not vars_.get(k), f"variável {k} deve ficar vazia"
          print("ok", sorted(vars_))
          PY
